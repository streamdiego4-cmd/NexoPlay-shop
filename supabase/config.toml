# NexoPlay V16 — Supabase Edge Functions
# nexo-ai is called by the signed-in NexoPlay client.
# nexo-push is called by the Supabase Database Webhook and authenticates
# with the NEXO_PUSH_SECRET header, so JWT verification is disabled there.

[functions.nexo-ai]
verify_jwt = true

[functions.nexo-push]
verify_jwt = false
